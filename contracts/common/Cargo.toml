[package]
name = "sororail-common"
description = "Shared types, errors, events and guards for the SoroRail payment contracts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
doctest = true

[features]
# Exposes `sororail_common::testutils` — lightweight test-environment helpers
# (token minting, address generation, ledger time control). Depend on this
# feature in the `[dev-dependencies]` section of every contract that uses it.
# Never enabled in production builds.
testutils = ["soroban-sdk/testutils", "dep:proptest", "std"]
# Host-only helpers such as `Error::as_str()`. Off by default so contract wasm
# builds stay free of the variant-name string table.
std = []

[dependencies]
soroban-sdk = { workspace = true }
proptest = { workspace = true, optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }

[lints]
workspace = true